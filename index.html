<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#7c6af7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="RolxDesk"/>
<title>RolxDesk</title>
<link rel="manifest" href="/manifest.webmanifest"/>

<link rel="apple-touch-icon" href="/icons/icon-192.svg"/>
<style id="rd-boot-style">
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070708;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
#rd-boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070708;overflow:hidden}
#rd-boot-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#rd-boot-mark{position:relative;display:flex;gap:.06em;align-items:center;justify-content:center;z-index:2}
.rd-letter{font-weight:800;font-size:clamp(72px,20vw,128px);line-height:1;letter-spacing:-.04em;color:var(--boot-accent,#7c6af7);opacity:0;will-change:transform,opacity,filter}
#rd-boot-sub{margin-top:16px;font:700 11px system-ui;letter-spacing:.18em;text-transform:uppercase;color:var(--boot-sub,#9b93b8);opacity:0;z-index:2;position:relative}
#rd-boot-status{margin-top:22px;font:500 13px system-ui;color:#7a7588;z-index:2;position:relative;min-height:1.2em}
#rd-boot-bar{margin-top:14px;width:min(220px,60vw);height:3px;background:#1a1822;border-radius:99px;overflow:hidden;z-index:2;position:relative}
#rd-boot-bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--boot-accent,#7c6af7),var(--boot-accent2,#a78bfa));box-shadow:0 0 12px var(--boot-accent,#7c6af7);transition:width .18s linear}
#rd-boot-impact{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0}
.rd-p{position:absolute;border-radius:50%;opacity:0;pointer-events:none}
body.boot-default .rd-letter.r{animation:liftUp .75s cubic-bezier(.2,1.4,.3,1) .08s forwards}
body.boot-default .rd-letter.d{animation:liftUp .75s cubic-bezier(.2,1.4,.3,1) .22s forwards;color:var(--boot-accent2,#a78bfa)}
body.boot-default #rd-boot-sub{animation:fadeUp .5s ease .55s forwards}
@keyframes liftUp{0%{opacity:0;transform:translateY(80px) scale(.7)}60%{opacity:1;transform:translateY(-8px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
body.boot-halloween{--boot-accent:#f97316;--boot-accent2:#a855f7;--boot-sub:#fdba74;background:#0a0408}
body.boot-halloween #rd-boot{background:radial-gradient(ellipse at 50% 35%,#3b0a18 0%,#070308 60%,#000 100%)}
body.boot-halloween .rd-letter.r{animation:slamL .7s cubic-bezier(.15,.9,.2,1.2) .05s forwards;color:#f97316}
body.boot-halloween .rd-letter.d{animation:slamR .7s cubic-bezier(.15,.9,.2,1.2) .18s forwards;color:#c084fc}
body.boot-halloween #rd-boot-sub{animation:glitchIn .55s steps(4) .55s forwards;color:#fdba74}
body.boot-halloween #rd-boot-mark{animation:shake .4s ease .75s 2}
@keyframes slamL{0%{opacity:0;transform:translateX(-120vw) rotate(-18deg) scale(1.4)}70%{opacity:1;transform:translateX(6px) rotate(2deg) scale(1.05)}100%{opacity:1;transform:translateX(0) rotate(0) scale(1)}}
@keyframes slamR{0%{opacity:0;transform:translateX(120vw) rotate(18deg) scale(1.4)}70%{opacity:1;transform:translateX(-6px) rotate(-2deg) scale(1.05)}100%{opacity:1;transform:translateX(0) rotate(0) scale(1)}}
@keyframes glitchIn{0%{opacity:0;clip-path:inset(40% 0 40% 0);transform:translateX(-8px)}40%{opacity:1;clip-path:inset(10% 0 20% 0);transform:translateX(6px)}70%{clip-path:inset(0 0 0 0);transform:translateX(-3px)}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,1px)}}
body.boot-leif{--boot-accent:#2dd4bf;--boot-accent2:#5eead4;--boot-sub:#99f6e4}
body.boot-leif #rd-boot{background:radial-gradient(ellipse at 50% 40%,#0a2a28 0%,#050a0a 70%)}
body.boot-leif .rd-letter.r{animation:fromLeft .8s cubic-bezier(.2,1.1,.3,1) .1s forwards;color:#2dd4bf}
body.boot-leif .rd-letter.d{animation:fromRight .8s cubic-bezier(.2,1.1,.3,1) .1s forwards;color:#5eead4}
body.boot-leif #rd-boot-sub{animation:fadeUp .5s ease .7s forwards}
@keyframes fromLeft{0%{opacity:0;transform:translateX(-100vw)}100%{opacity:1;transform:translateX(0)}}
@keyframes fromRight{0%{opacity:0;transform:translateX(100vw)}100%{opacity:1;transform:translateX(0)}}
body.boot-xmas{--boot-accent:#ef4444;--boot-accent2:#22c55e;--boot-sub:#fca5a5}
body.boot-xmas #rd-boot{background:radial-gradient(ellipse at 50% 20%,#1a0a0c 0%,#07090c 70%)}
body.boot-xmas .rd-letter.r{animation:dropBounce .85s cubic-bezier(.2,1.5,.3,1) .05s forwards;color:#ef4444}
body.boot-xmas .rd-letter.d{animation:dropBounce .85s cubic-bezier(.2,1.5,.3,1) .2s forwards;color:#22c55e}
body.boot-xmas #rd-boot-sub{animation:fadeUp .5s ease .7s forwards}
@keyframes dropBounce{0%{opacity:0;transform:translateY(-120vh) scale(.5)}55%{opacity:1;transform:translateY(12px) scale(1.08)}75%{transform:translateY(-6px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
body.boot-ri{--boot-accent:#e11d48;--boot-accent2:#f8fafc;--boot-sub:#fda4af}
body.boot-ri #rd-boot{background:#0a0608}
body.boot-ri .rd-letter.r{animation:wipeReveal .7s ease .15s forwards;color:#e11d48}
body.boot-ri .rd-letter.d{animation:wipeReveal .7s ease .28s forwards;color:#f8fafc}
body.boot-ri #rd-boot-sub{animation:fadeUp .45s ease .75s forwards}
body.boot-ri #rd-boot::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:#e11d48;transform:scaleX(0);transform-origin:left;animation:flagWipe .55s ease .05s forwards;z-index:0}
body.boot-ri #rd-boot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:#f8fafc;transform:scaleX(0);transform-origin:left;animation:flagWipe .55s ease .18s forwards;z-index:0}
@keyframes flagWipe{to{transform:scaleX(1)}}
@keyframes wipeReveal{0%{opacity:0;filter:blur(8px);transform:scale(1.2)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
body.boot-lebaran{--boot-accent:#f8fafc;--boot-accent2:#4ade80;--boot-sub:#bbf7d0}
body.boot-lebaran #rd-boot{background:radial-gradient(ellipse at 50% 45%,#1a2a1c 0%,#0a0c0a 65%)}
body.boot-lebaran .rd-letter.r{animation:bloom .9s cubic-bezier(.15,1.2,.3,1) .1s forwards;color:#f8fafc}
body.boot-lebaran .rd-letter.d{animation:bloom .9s cubic-bezier(.15,1.2,.3,1) .25s forwards;color:#4ade80}
body.boot-lebaran #rd-boot-sub{animation:fadeUp .5s ease .75s forwards}
@keyframes bloom{0%{opacity:0;transform:scale(.2);filter:blur(12px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes riseP{0%{opacity:0;transform:translateY(20vh) scale(.3)}15%{opacity:.55}85%{opacity:.3}100%{opacity:0;transform:translateY(-30vh) scale(1)}}
@keyframes fallP{0%{opacity:0;transform:translateY(-15vh) rotate(0)}20%{opacity:.5}100%{opacity:0;transform:translateY(110vh) rotate(240deg)}}
@keyframes driftLR{0%{opacity:0;transform:translateX(-20vw)}20%{opacity:.4}80%{opacity:.25}100%{opacity:0;transform:translateX(30vw)}}
@keyframes orbPulse{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.45;transform:scale(1.2)}}
</style>
<script>
window.__RD_DEFERRED_INSTALL=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__RD_DEFERRED_INSTALL=e;});
(function pickSeason(){
  var d=new Date(), m=d.getMonth()+1, day=d.getDate(), h=d.getHours();
  var cls="boot-default", label="RolxDesk";
  try{
    var raw=localStorage.getItem("rd_season_override");
    if(raw){
      var o=JSON.parse(raw);
      if(o&&o.id&&(!o.until||Date.now()<o.until)){
        if(o.id==="halloween-bb"){cls="boot-halloween";label="Halloween · Scaredy Pants";}
        else if(o.id==="leif-squidward"){cls="boot-leif";label="Leif Erikson Day";}
        else if(o.id==="bb-christmas"||o.id==="free-balloon"){cls="boot-xmas";label="Season of Lights";}
        else if(o.id==="indonesia-17agustus"){cls="boot-ri";label="17 Agustus · Merah Putih";}
        else if(o.id==="lebaran"||o.id==="ramadan-takjil"){cls="boot-lebaran";label="Lebaran / Takjil";}
        else if(o.id==="none"){cls="boot-default";label="RolxDesk";}
      }
    }
  }catch(e){}
  if(cls==="boot-default"){
    if((m===10&&day>=30)||(m===11&&day<=1)){cls="boot-halloween";label="Halloween · Scaredy Pants";}
    else if(m===10&&day>=9&&day<=10){cls="boot-leif";label="Leif Erikson Day";}
    else if(m===12&&day>=20&&day<=27){cls="boot-xmas";label="Season of Lights";}
    else if(m===8&&day===17){cls="boot-ri";label="17 Agustus · Merah Putih";}
    else if((m===3&&day>=20&&day<=22)||((m===2&&day>=18||m===3&&day<=19)&&(h>=18||h<5))){cls="boot-lebaran";label="Lebaran / Takjil";}
  }
  window.__RD_BOOT_CLASS=cls;
  window.__RD_BOOT_LABEL=label;
})();
</script>
</head>
<body class="boot-default">
<script>try{document.body.className=window.__RD_BOOT_CLASS||"boot-default";}catch(e){}</script>
<div id="rd-boot">
  <div id="rd-boot-fx" aria-hidden="true"></div>
  <div id="rd-boot-impact" aria-hidden="true"></div>
  <div id="rd-boot-mark"><span class="rd-letter r">R</span><span class="rd-letter d">D</span></div>
  <div id="rd-boot-sub">RolxDesk</div>
  <div id="rd-boot-status">Memuat…</div>
  <div id="rd-boot-bar"><i id="rd-boot-fill"></i></div>
</div>
<script>
(function cinematicBoot(){
  var cls=window.__RD_BOOT_CLASS||"boot-default";
  var sub=document.getElementById("rd-boot-sub");
  if(sub&&window.__RD_BOOT_LABEL) sub.textContent=window.__RD_BOOT_LABEL;
  var fx=document.getElementById("rd-boot-fx");
  if(!fx) return;
  var palette={"boot-halloween":["#f97316","#a855f7","#fbbf24","#7c2d12"],"boot-leif":["#2dd4bf","#5eead4","#99f6e4","#0f766e"],"boot-xmas":["#ef4444","#22c55e","#f8fafc","#fbbf24"],"boot-ri":["#e11d48","#ffffff","#e11d48","#fecdd3"],"boot-lebaran":["#f8fafc","#4ade80","#fbbf24","#bbf7d0"],"boot-default":["#7c6af7","#a78bfa","#1a7f64","#c4b5fd"]};
  var colors=palette[cls]||palette["boot-default"];
  var n=cls==="boot-xmas"?28:(cls==="boot-halloween"?22:18);
  for(var i=0;i<n;i++){
    var el=document.createElement("span");
    el.className="rd-p";
    var sz=3+Math.random()*(cls==="boot-xmas"?7:10);
    el.style.width=sz+"px"; el.style.height=sz+"px";
    el.style.left=(Math.random()*100)+"%"; el.style.top=(Math.random()*100)+"%";
    el.style.background=colors[i%colors.length];
    if(cls==="boot-xmas"){ el.style.borderRadius=Math.random()>0.5?"50%":"1px"; el.style.animation="fallP "+(5+Math.random()*6)+"s linear "+(Math.random()*3)+"s infinite"; }
    else if(cls==="boot-leif"){ el.style.animation="driftLR "+(6+Math.random()*5)+"s linear "+(Math.random()*2)+"s infinite"; }
    else if(cls==="boot-halloween"){ el.style.borderRadius=Math.random()>0.6?"2px":"50%"; el.style.animation="orbPulse "+(2+Math.random()*3)+"s ease-in-out "+(Math.random()*2)+"s infinite"; el.style.boxShadow="0 0 "+(6+Math.random()*10)+"px "+colors[i%colors.length]; }
    else if(cls==="boot-ri"){ el.style.borderRadius="1px"; el.style.height=(sz*0.45)+"px"; el.style.background=i%2===0?"#e11d48":"#ffffff"; el.style.animation="riseP "+(7+Math.random()*4)+"s linear "+(Math.random()*2)+"s infinite"; }
    else { el.style.animation="riseP "+(6+Math.random()*5)+"s linear "+(Math.random()*3)+"s infinite"; }
    el.style.opacity="0.35"; fx.appendChild(el);
  }
  if(cls==="boot-halloween"){
    setTimeout(function(){
      if(Math.random()>0.55) return;
      var impact=document.getElementById("rd-boot-impact");
      if(!impact) return;
      impact.style.cssText="position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#000;opacity:0;transition:opacity .06s;pointer-events:none;font:900 22vw system-ui;color:#f97316;text-shadow:0 0 40px #f97316,0 0 80px #7c3aed";
      impact.textContent="BOO"; impact.style.opacity="1"; document.body.style.background="#fff";
      setTimeout(function(){ document.body.style.background=""; impact.style.opacity="0"; setTimeout(function(){ impact.textContent=""; },150); },140);
      setTimeout(function(){ impact.style.opacity="0.7"; impact.style.fontSize="18vw"; impact.textContent="✦"; setTimeout(function(){ impact.style.opacity="0"; impact.textContent=""; },100); },320);
    }, 550);
  }
  if(cls!=="boot-halloween"){
    setTimeout(function(){
      var mark=document.getElementById("rd-boot-mark");
      if(mark){ mark.style.transition="filter .12s"; mark.style.filter="drop-shadow(0 0 28px "+colors[0]+")"; setTimeout(function(){ mark.style.filter=""; },180); }
    }, cls==="boot-xmas"?700:600);
  }
})();
(async function loadApp(){
  var statusEl=document.getElementById("rd-boot-status"), fill=document.getElementById("rd-boot-fill"), t0=Date.now();
  function status(m){if(statusEl)statusEl.textContent=m}
  function progress(p){if(fill)fill.style.width=Math.min(100,Math.max(0,p))+"%"}
  if("serviceWorker" in navigator){ try{ var regs=await navigator.serviceWorker.getRegistrations(); for(var i=0;i<regs.length;i++){try{await regs[i].update();}catch(e){}} await navigator.serviceWorker.register("/sw.js?v=123"); }catch(e){} }
  try{
    var n=8,b64="";
    for(var i=0;i<n;i++){ status("Modul "+(i+1)+"/"+n); progress((i/n)*82); var r=await fetch("./ui.p"+i+".b64?v="+Date.now(),{cache:"no-store"}); if(!r.ok)throw new Error("ui.p"+i); b64+=(await r.text()).replace(/\s+/g,""); }
    if(b64.length%4!==0)b64+="=".repeat((4-b64.length%4)%4);
    var raw=atob(b64),bin=new Uint8Array(raw.length); for(var j=0;j<raw.length;j++)bin[j]=raw.charCodeAt(j);
    var html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    html=html.replace(/function maybeUpdateTitle\(session, userText\) \{\s*if \(!session \|\| !userText\) return;\s*if \(session\.titleUpdates == null\) session\.titleUpdates = 0;\s*if \(session\.titleUpdates >= 2\) return;\s*\/\/ abaikan sapaan pendek\s*const t = userText\.trim\(\);/,"function maybeUpdateTitle(session, userText) {\n  if (!session || userText == null || userText === \"\") return;\n  if (session.titleUpdates == null) session.titleUpdates = 0;\n  if (session.titleUpdates >= 2) return;\n  const t = String(typeof userText === \"object\" ? (userText.content || userText.text || userText.title || \"\") : userText).trim();\n  if (!t) return;");
    html=html.replace(/if \(t && t\.trim\(\)\) \{\s*s\.title = t\.trim\(\)\.slice\(0, 60\);/g,"if (t != null && String(t).trim()) {\n    s.title = String(t).trim().slice(0, 60);");
    html=html.replace(/const t = userText\.trim\(\);/g,"const t = String(typeof userText === \"object\" && userText ? (userText.content || userText.text || \"\") : (userText || \"\")).trim();");
    html=html.replace(/await handleVoiceUserSpeech\(finalText\.trim\(\)\);/g,"await handleVoiceUserSpeech(String(finalText||\"\").trim());");
    html=html.replace(/if \(finalText\.trim\(\) && state\.voiceActive\)/g,"if (String(finalText||\"\").trim() && state.voiceActive)");
    html=html.replace(/<script[^>]*(extras(?:-ui|-fix|-hotfix)?\.js|jsdelivr\.net\/gh\/Frost098\/RolxDesk)[^>]*><\/script>/gi,"");
    html=html.replace(/<\/body>/i,'<script src="./extras.js?v=123"><\/script><script src="./extras-ui.js?v=123"><\/script><script src="./extras-fix.js?v=123"><\/script><script src="./extras-hotfix.js?v=123"><\/script><script src="./extras-cisypi.js?v=123"><\/script><script src="./extras-v11.js?v=123"><\/script><script src="./extras-v12.js?v=123"><\/script><script src="./extras-voice.js?v=123"><\/script><script src="./extras-voice-fix.js?v=123"><\/script><script src="./extras-voice-mobile.js?v=123"><\/script><script src="./extras-fish-agent.js?v=123"><\/script><script src="./extras-season.js?v=123"><\/script><script src="./extras-cool.js?v=123"><\/script><script src="./extras-mobile-secret.js?v=123"><\/script><script src="./extras-fun-tools.js?v=123"><\/script><script src="./extras-install.js?v=123"><\/script></body>');
    await new Promise(function(res){setTimeout(res,Math.max(0,1800-(Date.now()-t0)))});
    progress(100); status("Siap"); document.open(); document.write(html); document.close();
  }catch(err){ status("Gagal: "+(err&&err.message?err.message:err)); console.error(err); }
})();
</script>
</body>
</html>
