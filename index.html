<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RolxDesk</title>
<style>body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>
<div id="s">Memuat RolxDesk…</div>
<script>
(async function() {
  const n = 8;
  let b64 = "";
  for (let i = 0; i < n; i++) {
    const r = await fetch("./ui.p" + i + ".b64");
    if (!r.ok) throw new Error("Gagal muat ui.p" + i + ".b64");
    b64 += (await r.text()).trim();
  }
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  let html = await new Response(stream).text();
  if (!/extras\.js/.test(html)) {
    html = html.replace(/<\/body>/i, '<script src="./extras.js"><\/script></body>');
  }
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.getElementById("s").textContent = "Gagal: " + e.message;
});
</script>
</body>
</html>
