<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RolxDesk</title>
<style>body{margin:0;background:#0a0a0a;color:#eee;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>
<div id="s">Memuat RolxDesk…</div>
<script>
(async function() {
  const parts = ["ui.a.b64gz", "ui.b.b64gz"];
  let b64 = "";
  for (const p of parts) {
    const r = await fetch("./" + p);
    if (!r.ok) throw new Error("Gagal muat " + p);
    b64 += (await r.text()).trim();
  }
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.getElementById("s").textContent = "Gagal: " + e.message + " — coba Chrome/Firefox";
});
</script>
</body>
</html>
